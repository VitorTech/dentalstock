services:
  db:
    image: postgres:16-alpine
    container_name: dentalstock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentalstock
      POSTGRES_PASSWORD: dentalstock
      POSTGRES_DB: dentalstock
    # 5433 no host: convive com outro Postgres já rodando na 5432.
    ports:
      - "5433:5432"
    volumes:
      - dentalstock_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalstock -d dentalstock"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dentalstock_db_data:
